# One-click deploy on Render: https://dashboard.render.com/select-repo?type=blueprint
# After first deploy, set MOMO_LOOP_SECRET and CORS_ORIGINS to your public URL.

services:
  - type: web
    name: momo-loop
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: momo-loop-db
          property: connectionString
      - key: MOMO_LOOP_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_DIST
        value: /app/frontend/dist

databases:
  - name: momo-loop-db
    plan: free
    databaseName: momo_loop
    user: momo
