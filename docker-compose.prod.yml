# Local production smoke-test: docker compose -f docker-compose.prod.yml up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: momo
      POSTGRES_PASSWORD: momo
      POSTGRES_DB: momo_loop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momo -d momo_loop"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8080:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://momo:momo@db:5432/momo_loop
      MOMO_LOOP_SECRET: local-prod-smoke-secret
      CORS_ORIGINS: http://127.0.0.1:8080,http://localhost:8080
      FRONTEND_DIST: /app/frontend/dist
      PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
